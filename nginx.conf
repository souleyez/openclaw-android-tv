server {
    listen 80;
    listen [::]:80;
    server_name android-tv.openclaw.ai;

    root /var/www/openclaw-android-tv;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    location /docs {
        alias /var/www/openclaw-android-tv/docs;
        autoindex on;
    }
}
