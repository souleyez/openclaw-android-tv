org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Factory/release signing is intentionally local-only. Put real values in
# local gradle properties or environment variables; never commit keystores.
# OPENCLAW_RELEASE_STORE_FILE=C:\\path\\to\\openclaw-tv-factory.jks
# OPENCLAW_RELEASE_STORE_PASSWORD=
# OPENCLAW_RELEASE_KEY_ALIAS=openclaw-tv
# OPENCLAW_RELEASE_KEY_PASSWORD=
#
# Debug/local HTTP testing can opt in explicitly:
# OPENCLAW_USES_CLEARTEXT_TRAFFIC=true
